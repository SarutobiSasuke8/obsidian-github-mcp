name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run check:registry
      - run: npm audit --audit-level=high

  # Report floating runtime references (unpinned base images, engines.node
  # ranges, action tags, git deps without a commit SHA). Report mode: warns and
  # writes a step summary, never fails. Flip to failing with `--strict`.
  # See docs/runtime-pins.md.
  pin-check:
    name: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report floating references
        run: node scripts/pin-check.mjs
